spring.application.name=radar-licitacoes-backend

# ----------------------------------------------------
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/radar_licitacoes
spring.datasource.username=admin
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------
# 2. JPA & HIBERNATE
# ----------------------------------------------------
# Desativa a criação automática, pois será usado o Flyway
spring.jpa.hibernate.ddl-auto=validate

# Mostrar e formatar SQL no console para facilitar depuração
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------
# 3. FLYWAY (MIGRATIONS)
# ----------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------
# 4. JACKSON CONFIGURATION
# ----------------------------------------------------
# Ignorar campos nulos nos retornos JSON
spring.jackson.default-property-inclusion=non_null
